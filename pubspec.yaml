name: FinTask
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  flutter_screenutil: ^5.9.0
  lottie: ^2.3.2
  flutter_animate: ^4.2.0+1
  http: ^1.1.0
  provider: ^6.1.1
  intl: ^0.18.1
  image_picker: ^1.0.4
  accordion: ^2.6.0
  dio: ^5.3.4
  permission_handler: ^11.1.0
  introduction_screen: ^3.1.12
  flutter_floating_bottom_bar: ^1.2.0
  font_awesome_flutter: ^10.6.0
  flutter_slidable: ^3.0.1
  syncfusion_flutter_datepicker: ^24.1.45
  iconify_flutter: ^0.0.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - animations/
  fonts:
    - family: Agbalumo
      fonts:
        - asset: fonts/Rebond-Regular.otf
        - asset: fonts/Rebond-Bold.otf
        - asset: fonts/Rebond-Medium.otf
        - asset: fonts/Rebond-light.otf
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
